name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}
          MEMORY_FILE: /tmp/jarvis_test
        run: pytest tests/ -v

  # ── Deploy — only runs if tests pass, only on push to main ──
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Trigger deploy
        run: |
          curl -X POST http://${{ secrets.VM_HOST }}:8000/deploy \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" \
            --fail \
            --silent \
            --show-error